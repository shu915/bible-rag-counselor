services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bible_rag
    ports:
      # 他プロジェクトの Postgres が 5432 / 5433 を使っているため 5434 にする(ローカル専用)
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bible_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
