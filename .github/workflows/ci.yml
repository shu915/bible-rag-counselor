name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に続けて push したら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 実 DB(pgvector)を使うテストを書いたら、ここに services: postgres を足す。
    # 今のテストは DB を使わない(聖書の XML の変換と、チェックサムの検証だけ)
    steps:
      - uses: actions/checkout@v7
        with:
          # GITHUB_TOKEN を .git に残さない(後続の npm ci のスクリプトから読まれないように)
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # 出典の XML は、リポジトリに入れていない(再配布してよいか分からないため)。
      # 配布元から取得する。コミットを固定し、チェックサムを確かめるので、内容が変わっていれば失敗する
      - run: npm run bible:fetch
      - run: npm test
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run build
